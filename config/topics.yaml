      - deep learning
  # 专业赛事雷达（首选来源）：831 条在办/待开始赛事，detail 字段自带
  # 「赛事背景 / 赛事任务 / 评审规则」成段正文，是单篇精读最需要的素材
  radar:
    enabled: true
    data_url: https://ye4wzp.github.io/ai-contest-radar/data/data.js
  # 国际 ML 竞赛聚合：Astro 静态页，赛事数据在 data-competitions 属性里
  mlcontests:
    enabled: true
    url: https://mlcontests.com/
  # Codabench 公开竞赛广场：直连会被反爬蜜罐挡，走无头浏览器取 DRF JSON；
  # 列表接口不含截止时间，成稿前会用官方页核验（needs_verify）
  codabench:
    enabled: true
    api_url: https://www.codabench.org/api/competitions/?page=1&page_size=40
  # FlyAI：主站有瑞数验证码（无头也拦），抓静态镜像；赛题多为长期开放的练习赛
  flyai:
    enabled: true
    url: https://static.flyai.com/
  kaggle:
    enabled: true
    # 通过 kaggle API 拉取（需要 ~/.kaggle/kaggle.json 或 KAGGLE_USERNAME/KEY）
    search_terms:
      - image restoration
      - super resolution
      - denoising
      - image enhancement
      - computational photography
    max_results: 20
  datacastle:
    enabled: true
    # DC 竞赛在办赛事列表（SPA 背后的 JSON 接口，实测 /v3/api/common/cmpt/cmptIndex.json）
    # 列表不含奖金/截止时间，成稿时写「待官方公布」
  coggle:
    enabled: true
    # Coggle 数据科学的赛事聚合页（?platform= 可切 xfyun 等）
    # 部分网络对该站 DNS 阻断，抓不到时自动降级跳过
    url: https://coggle.club/?platform=xfyun
  baseline:
    enabled: true
    # Datawhale「竞赛Baseline」开源仓库：往届赛题 baseline 复现合集（学习资源，非赛事）
    # 覆盖深度学习/AI 泛领域（不限于底层视觉）；进精读候选池的数量上限
    max_items: 30
  tianchi:
    enabled: true
    list_url: https://tianchi.aliyun.com/competition/activeList
    # v3 官方接口：返回进行中赛事（含报名/比赛截止时间与奖金），isActive=1 只取进行中
    api_url: https://tianchi.aliyun.com/v3/proxy/competition/api/race/page
    max_pages: 5
  aicrowd:
    enabled: true
    url: https://www.aicrowd.com/challenges
  web_search:
    enabled: true
    # 搜索兜底优先走无 key 的 Bing 网页版；命中结果必须能解析出未来日期才保留
    bing_fallback: true
    # 查询词保持前瞻：只搜下一届赛事，避免整页都是已过期的旧届信息
    queries:
      - "CVPR 2027 workshop challenge low-level vision"
      - "NTIRE 2027 challenge image restoration"
      - "MIPI 2027 challenge mobile imaging"
      - "图像复原 挑战赛 2027 报名"
  curated:
    # 人工兜底的赛事源：稳定、可校验；页面过期 / 404 会被时效过滤自动跳过
    - name: NTIRE 2026
      url: https://www.cvlai.net/ntire/2026/
      desc: CVPR Workshop 旗下的图像复原挑战赛系列，赛道覆盖超分、去噪、去模糊与真实场景复原，baseline 完整，适合作为参赛起点。
    - name: NTIRE 2027
      url: https://www.cvlai.net/ntire/2027/
      desc: NTIRE 下一届挑战赛主页，开放注册后从这里拿赛道与时间线。
    - name: MIPI Challenge
      url: https://mipi-challenge.org/
      desc: 面向移动端影像的挑战赛，赛题集中在 RAW 域去噪、去马赛克与低光增强，工程落地价值高。
    - name: MIPI 2027
      url: https://mipi-challenge.org/MIPI2027/
      desc: MIPI 下一届挑战赛主页，页面开放后自动进入候选。
  # 赛题方向标签的三级判定（competitions._contest_category 使用）：
  # 1) 先按上方 categories 词表判底层视觉类目，但 weak_category_words 里的泛化词
  #    （如「大模型」）在竞赛语境常指向 LLM / 具身方向，单独命中不算证据；
  # 2) 底层视觉未命中时按 general_tracks 给中性方向标签，避免把具身 / 图网络
  #    这类通用 AI 赛误标成「生成式复原」；
  # 3) 仍然不命中才落「综合赛事」
  weak_category_words: [大模型]
  general_tracks:
    具身与机器人: [具身, 机器人, 仿真, 机械臂, 自动驾驶, 智能驾驶]
    大模型与智能体: [大模型, llm, 语言模型, 智能体, agent, 提示词]
    图与数据智能: [图网络, 图神经网络, graph neural, 决策智能, 数据挖掘, 知识图谱]
    AI 应用创新: [aigc, 黑客松, 应用创新, 融合创新, 创意, 内容生成]
  filter:
    min_score: 3.0
    # 单篇深度精读：每期只写一场赛事。这里给 3 是为了留出「核验发现已截止就顺延」
    # 的备选空间，最终成稿仍然只用 1 条（pipeline 里再收敛）
    top_n: 3
    # 策展源天然相关，不强制命中关键词；平台/搜索来源仍会靠评分排序
    require_keyword_hit: 0
    # 只保留未截止、或截止时间在未来 N 天内的赛事
    upcoming_days: 120
  # 单篇精读放开的赛道：底层视觉 / CV / 深度学习 / AI 泛领域，均可入选
  focus:
    - 底层视觉与图像复原（超分、去噪、去模糊、暗光、压缩伪影）
    - 计算机视觉与多模态（检测、分割、跟踪、3D、视频理解）
    - 生成式模型与 AI 应用（扩散、视频生成、Agent、RAG、具身）
    - 遥感 / 医疗 / 工业质检等真实行业赛题
    - 数据挖掘与表格建模（结构化数据、时序预测、推荐）

# ---------- 出稿与排期 ----------
pipelines:
  paper:
    layout: paper        # 对应 app/render/styles.py 里的版式
    require_figures: 1   # 至少 1 张架构图/对比图
    max_chars: 3500
  industry:
    layout: industry
    require_figures: 0
    max_chars: 3000
  contest:
    layout: contest
    require_figures: 0
    max_chars: 2200

# cron 表达式（APScheduler，默认时区 Asia/Shanghai）
schedule:
  paper: "30 7 * * 1,4"      # 周一、周四 07:30 发论文
  industry: "0 8 * * 6"      # 周六 08:00 发业界
  contest: "0 9 * * 1"       # 周一 09:00 发竞赛
  collect: "0 3 * * *"       # 每天 03:00 预热抓取缓存
  enabled: "true"

# ---------- 视觉主题（渲染器读取，微信内联样式） ----------
theme:
  ink: "#1B1D22"          # 正文
  sub: "#6B7280"          # 辅助文字
  primary: "#2A4BD7"      # 主色（学术蓝）
  primary_soft: "#EEF2FF" # 主色浅底
  accent: "#00A88F"       # 辅助色（青）
  warm: "#E8833A"         # 竞赛暖色
  quote_bg: "#F7F8FA"
  line: "#E6E8EE"
  font: '-apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif'
